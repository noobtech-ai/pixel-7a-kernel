name: Pixel 7a - R20 + V1 Performance + SUSFS Open Redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R20 6.1.145 + V1 Performance + Open Redirect
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout WildKernels R20
        uses: actions/checkout@v7
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          ref: r20
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: 3.2.0
          testing: false

      - name: Setup 16 GB swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android14-6.1
          sublevel: "145"

      - name: Download 6.1.145 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="$(date -u -d '2025-09-05 04:20:00 UTC' +%s)"
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$EPOCH" '+%a %b %d %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"

      - name: Extract sublevel and filename
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"

      - name: KernelSU Next
        uses: ./.github/actions/root-setup
        with:
          flavor: next
          commit: "19d9e1f"

      - name: SUSFS from R20 pinned commit
        uses: ./.github/actions/susfs
        with:
          susfs_commit: "4fc9c1898ea66f51847cdbc0d1473ea4ef525a70"
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"
          sublevel: "145"
          root_flavor: next
          # R20 normally sets this true when NoMount is selected, which
          # disables Open Redirect. We deliberately keep it false.
          nomount_enabled: "false"

      - name: NoMount from R20
        uses: ./.github/actions/nomount
        with:
          commit: "d0f57d5c37ff02aae2299daded57919153240cb3"
          kernel_version: "6.1"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "145"

      - name: Ptrace fix
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: BTF eBPF FUSE-BPF
        uses: ./.github/actions/btf
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "145"

      - name: Baseband Guard
        uses: ./.github/actions/bbg

      - name: DroidSpaces
        uses: ./.github/actions/droidspaces
        with:
          version: android14-6.1
          kernel_version: "6.1"
          droidspaces_commit: ""

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      # Intentionally NO CONFIG_HZ_300.

      - name: Verify Open Redirect
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/kernel/common/arch/arm64/configs/gki_defconfig"
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' "$CONFIG"
          echo "Open Redirect is enabled."

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "145"
          brand_name: Wild

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: R20-OpenRedirect-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore

      - name: Setup cache and build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"

      - name: Initialize config fragment
        run: touch "${GITHUB_WORKSPACE}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1

      - name: Upload AnyKernel3
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Pixel7a-R20-6.1.145-V1-Performance-SUSFS-OpenRedirect
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9
