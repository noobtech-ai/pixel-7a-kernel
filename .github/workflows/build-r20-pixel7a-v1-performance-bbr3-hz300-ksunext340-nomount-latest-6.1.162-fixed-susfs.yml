name: Pixel 7a - R20 + V1 Performance + BBRv3 + HZ300 + KSU-Next 3.4

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R20 6.1.162 + V1 Performance + BBRv3 + HZ300 + KSU-Next 3.4
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout WildKernels R20
        uses: actions/checkout@v7
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          ref: r20
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: 3.2.0
          testing: false

      - name: Setup 16 GB swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android14-6.1
          sublevel: "162"

      - name: Download 6.1.162 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2026-03"

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="$(date -u -d '2026-03-05 04:20:00 UTC' +%s)"
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$EPOCH" '+%a %b %d %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"

      - name: Extract sublevel and filename
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "162"
          os_patch_level: "2026-03"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "162"
          os_patch_level: "2026-03"

      - name: KernelSU Next
        uses: ./.github/actions/root-setup
        with:
          flavor: next
          commit: "1a879d6a866f80b1fa1c1009a2ffa747873cbb5e"

      # The current SUSFS setup expects the current WildKernels
      # kernel_patches/pershoot compatibility patches.
      - name: Update kernel_patches for current SUSFS integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/kernel_patches"
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git             "${GITHUB_WORKSPACE}/kernel_patches"
          test -f "${GITHUB_WORKSPACE}/kernel_patches/pershoot/susfs4ksu/0001-pershoot-Allow-core-to-be-built-with-no-features.patch"
          echo "Current kernel_patches SUSFS compatibility patch found."

      - name: SUSFS (latest Android 14 / 6.1 branch tip)
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ""
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2026-03"
          sublevel: "162"
          root_flavor: next
          # R20 normally sets this true when NoMount is selected, which
          # disables Open Redirect. We deliberately keep it false.
          nomount_enabled: "false"

      - name: NoMount (latest WildKernels nightly commit)
        uses: ./.github/actions/nomount
        with:
          commit: "7919faf2ab574110e388a4f444e5fef909c24e16"
          kernel_version: "6.1"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "162"

      - name: Ptrace fix
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: BTF eBPF FUSE-BPF
        uses: ./.github/actions/btf
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "162"

      - name: Baseband Guard
        uses: ./.github/actions/bbg

      # R20's BBRv3 is supplied by the Networking action.
      # The previous workflow omitted this action, so BBRv3 was not built.
      - name: Networking + BBRv3
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          kernel_version: "6.1"
          android_version: android14
          sublevel: "162"

      - name: DroidSpaces
        uses: ./.github/actions/droidspaces
        with:
          version: android14-6.1
          kernel_version: "6.1"
          droidspaces_commit: ""

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      - name: Enable 300 Hz kernel timer
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_HZ_100=n
            CONFIG_HZ_250=n
            CONFIG_HZ_300=y
            CONFIG_HZ_1000=n
            CONFIG_HZ=300

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "162"
          brand_name: Wild

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Verify final Open Redirect, BBRv3, NoMount and HZ300 config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/kernel/common/arch/arm64/configs/gki_defconfig"

          echo "Final Open Redirect setting:"
          grep -E '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=' "$CONFIG"
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' "$CONFIG"
          echo "Open Redirect is ENABLED."

          echo "Final BBR config:"
          grep -E '^(CONFIG_TCP_CONG_BBR|CONFIG_TCP_CONG_BBR2|CONFIG_TCP_CONG_BBR3)=' "$CONFIG" || true
          grep -q '^CONFIG_TCP_CONG_BBR3=y$' "$CONFIG"
          echo "BBRv3 is ENABLED."

          echo "Final NoMount setting:"
          grep -q '^CONFIG_NOMOUNT=y$' "$CONFIG"
          echo "NoMount is ENABLED."

          echo "Final HZ settings:"
          grep -E '^CONFIG_HZ(_100|_250|_300|_1000)?=' "$CONFIG" || true
          grep -q '^CONFIG_HZ_300=y$' "$CONFIG"
          grep -q '^CONFIG_HZ=300$' "$CONFIG"
          echo "300 Hz is ENABLED."

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: R20-KSU34-NoMountLatest-OpenRedirect-BBR3-HZ300-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore

      - name: Setup cache and build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "162"

      - name: Initialize config fragment
        run: touch "${GITHUB_WORKSPACE}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1

      - name: Upload AnyKernel3
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Pixel7a-R20-6.1.162-V1-Performance-BBR3-HZ300-KSU-Next-3.4-NoMountLatest-OpenRedirect
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9
