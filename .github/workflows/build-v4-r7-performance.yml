name: Pixel 7a V4 - R7 6.1.145 Performance Only

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R7 6.1.145 + V1 Performance (No NoMount)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout WildKernels R7
        uses: actions/checkout@v4
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          ref: r7
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: 3.1.1
          testing: false

      -       - name: Setup swap
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        with:
          version: android14-6.1
          sublevel: "145"

      - name: Download 6.1.145 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"

      - name: Extract sublevel / filename
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"

      - name: KernelSU Next
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ""

      - name: Fix R7 SUSFS action
        shell: bash
        run: |
          set -euo pipefail
          cp -a .github/actions/susfs .github/actions/susfs-r7-fixed
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/actions/susfs-r7-fixed/action.yml")
          s = p.read_text()
          start = s.find('        COMMIT1="')
          end_marker = '        git cherry-pick "$COMMIT2"'
          end = s.find(end_marker)
          if start == -1 or end == -1:
              raise SystemExit("Expected obsolete R7 SUSFS cherry-pick block was not found")
          end += len(end_marker)
          p.write_text(s[:start] + s[end:])
          PY
          ! grep -q '8d2420be13e43d4cc0d80215d08ed475081a1404' .github/actions/susfs-r7-fixed/action.yml

      - name: SUSFS
        uses: ./.github/actions/susfs-r7-fixed
        with:
          susfs_commit: ""
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"
          sublevel: "145"

      # Deliberately NO Hookless NoMount and NO PathHide/Cloak in V4.

      - name: Networking / BBRv3
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          kernel_version: "6.1"
          android_version: android14
          sublevel: "145"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Ptrace
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: Remove forced TCP_NODELAY
        shell: bash
        run: |
          set -euo pipefail
          P=".github/actions/performance/action.yml"
          test -f "$P"
          sed -i '/force_tcp_nodelay\.patch/d' "$P"
          ! grep -q 'force_tcp_nodelay\.patch' "$P"

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      - name: Enable HZ=300
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          test -f "$DEFCONFIG"
          sed -i -E '/^CONFIG_HZ_(100|250|300|1000)=y$/d' "$DEFCONFIG"
          sed -i -E '/^CONFIG_HZ=[0-9]+$/d' "$DEFCONFIG"
          printf '\nCONFIG_HZ_300=y\nCONFIG_HZ=300\n' >> "$DEFCONFIG"

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "145"

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-R7-V4-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Setup cache/build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"

      - name: Initialize config fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1
          bypass: false

      - name: Upload AnyKernel3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-android14-2025-09-R7-V4-Performance-Only-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9
