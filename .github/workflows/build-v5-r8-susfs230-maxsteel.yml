name: Pixel 7a V5 - R8 6.1.145 + V1 Performance + SUSFS 2.3.0 + MaxSteel NoMount 2.0.0

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R8 6.1.145 / V5 / SUSFS 2.3.0 / NoMount 2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout R8 source
        uses: actions/checkout@v4
        with:
          ref: r8
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup swap
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android14-6.1
          sublevel: "145"
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download 6.1.145 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"

      - name: Set fixed build timestamp
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(date -u -d '2025-09-05 04:20:00 UTC' +%s)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$SOURCE_DATE_EPOCH" '+%a %b %d %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"

      - name: Extract sublevel and filename
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"

      - name: KernelSU Next
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ""

      # IMPORTANT:
      # Do NOT use WildKernels' normal SUSFS action here. Its automatic
      # branch name is gki-android14-6.1. This build intentionally uses
      # the official SUSFS development branch gki-android14-6.1-dev,
      # which contains SUSFS v2.3.0.
      - name: Prepare official SUSFS 2.3.0 development branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf susfs4ksu

          git clone --depth=1 \
            --branch gki-android14-6.1-dev \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          echo "SUSFS module version:"
          grep '^version=' ksu_module_susfs/module.prop

          test "$(grep '^version=' ksu_module_susfs/module.prop | cut -d= -f2)" = "v2.3.0"

          # These are the same WildKernels compatibility patches normally
          # applied by its SUSFS setup action.
          patch -p1 < "${GITHUB_WORKSPACE}/kernel_patches/pershoot/susfs4ksu/0001-pershoot-Allow-core-to-be-built-with-no-features.patch"
          patch -p1 < "${GITHUB_WORKSPACE}/kernel_patches/pershoot/susfs4ksu/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch"

          test -f kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

      - name: Apply SUSFS 2.3.0 to kernel
        shell: bash
        run: |
          set -euo pipefail

          COMMON="${GITHUB_WORKSPACE}/kernel/common"

          cp -f susfs4ksu/kernel_patches/fs/* \
            "${COMMON}/fs/"

          cp -f susfs4ksu/kernel_patches/include/linux/* \
            "${COMMON}/include/linux/"

          cd "${COMMON}"

          patch -p1 < \
            "${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

      - name: Enable SUSFS 2.3.0 configs
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_MAP=y

      - name: Integrate MaxSteel NoMount 2.0.0
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/tags/v2.0.0/kernel/setup.sh \
            -o /tmp/nomount-setup.sh

          chmod +x /tmp/nomount-setup.sh
          /tmp/nomount-setup.sh v2.0.0

          test -d "${GITHUB_WORKSPACE}/kernel/common/fs/nomount"
          test -f "${GITHUB_WORKSPACE}/kernel/common/fs/nomount/Kconfig"

      - name: Enable NoMount built-in
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_NOMOUNT=y

      # V1 performance set used in the earlier working R7/R8 builds.
      - name: Networking and BBRv3
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          kernel_version: "6.1"
          android_version: android14
          sublevel: "145"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"
          sublevel: "145"

      - name: Ptrace
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      - name: Enable HZ 300
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_HZ_300=y
            CONFIG_HZ=300

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "145"

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5-R8-6.1.145-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Setup cache and build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"

      - name: Initialize config fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1
          bypass: false

      - name: Upload V5 AnyKernel3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-android14-2025-09-R8-V5-Performance-SUSFS230-NoMount200-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9

      - name: Upload SUSFS 2.3.0 module source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SUSFS-2.3.0-source
          path: ${{ github.workspace }}/susfs4ksu/ksu_module_susfs/**
          if-no-files-found: error
          compression-level: 9
          
