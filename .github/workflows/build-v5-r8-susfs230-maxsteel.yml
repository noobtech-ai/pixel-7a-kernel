name: Pixel 7a V5 - R8 6.1.145 + V1 Performance + SUSFS 2.3.0 + MaxSteel NoMount 2.0.0

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R8 6.1.145 / V5 / SUSFS 2.3.0 / NoMount 2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # This is important: your repository only stores the workflow.
      # The actual WildKernels R8 source + all of its local actions are
      # checked out here, so you do NOT need to upload the .github/actions
      # folder yourself.
      - name: Checkout WildKernels R8 build system
        uses: actions/checkout@v4
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          ref: r8
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: 3.1.1
          testing: false

      - name: Setup 16 GB swap
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android14-6.1
          sublevel: "145"
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download 6.1.145 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(date -u -d '2025-09-05 04:20:00 UTC' +%s)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$SOURCE_DATE_EPOCH" '+%a %b %d %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"

      - name: Extract sublevel and filename
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"

      - name: KernelSU Next
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ""

      # ------------------------------------------------------------------
      # SUSFS 2.3.0
      #
      # WildKernels R8 normally derives:
      #   gki-android14-6.1
      #
      # That branch is not the SUSFS 2.3.0 development branch.
      # We keep ALL of WildKernels' R8 SUSFS compatibility/config/patch
      # actions, but change only the branch used by susfs-setup to:
      #   gki-android14-6.1-dev
      # ------------------------------------------------------------------
      - name: Switch R8 SUSFS action to official v2.3.0 development branch
        shell: bash
        run: |
          set -euo pipefail

          ACTION=".github/actions/susfs-setup/action.yml"
          test -f "$ACTION"

          sed -i \
            's/SUSFS_BRANCH="gki-${{ inputs.version }}"/SUSFS_BRANCH="gki-${{ inputs.version }}-dev"/' \
            "$ACTION"

          grep -q 'SUSFS_BRANCH="gki-${{ inputs.version }}-dev"' "$ACTION"

          echo "R8 SUSFS setup now uses gki-${{ inputs.version }}-dev"

      - name: SUSFS 2.3.0
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ""
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"
          sublevel: "145"

      - name: Verify SUSFS 2.3.0
        shell: bash
        run: |
          set -euo pipefail

          test -f susfs4ksu/ksu_module_susfs/module.prop
          VERSION="$(sed -n 's/^version=//p' susfs4ksu/ksu_module_susfs/module.prop)"

          echo "Detected SUSFS version: $VERSION"
          test "$VERSION" = "v2.3.0"

          test -f susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
          test -f kernel/common/fs/susfs.c
          test -f kernel/common/include/linux/susfs.h

      # ------------------------------------------------------------------
      # MaxSteel NoMount v2.0.0
      # ------------------------------------------------------------------
      - name: Integrate MaxSteel NoMount 2.0.0
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/tags/v2.0.0/kernel/setup.sh \
            -o /tmp/nomount-setup.sh

          chmod +x /tmp/nomount-setup.sh
          /tmp/nomount-setup.sh v2.0.0

          test -L common/fs/nomount
          test -f NoMount/kernel/src/Kconfig
          test -f NoMount/kernel/src/Makefile

      - name: Enable NoMount
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_NOMOUNT=y

      # ------------------------------------------------------------------
      # V1 Performance Pack
      # ------------------------------------------------------------------
      - name: Networking and BBRv3
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          kernel_version: "6.1"
          android_version: android14
          sublevel: "145"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Ptrace
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: Remove forced TCP NODELAY
        shell: bash
        run: |
          set -euo pipefail

          P=".github/actions/performance/action.yml"
          test -f "$P"

          sed -i '/force_tcp_nodelay\.patch/d' "$P"

          if grep -q 'force_tcp_nodelay\.patch' "$P"; then
            echo "TCP_NODELAY patch is still present"
            exit 1
          fi

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      - name: Enable HZ 300
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          test -f "$DEFCONFIG"

          sed -i -E '/^CONFIG_HZ_(100|250|300|1000)=y$/d' "$DEFCONFIG"
          sed -i -E '/^CONFIG_HZ=[0-9]+$/d' "$DEFCONFIG"

          printf '\nCONFIG_HZ_300=y\nCONFIG_HZ=300\n' >> "$DEFCONFIG"

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "145"

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-R8-V5-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Setup cache and build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"

      - name: Initialize config fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1
          bypass: false

      - name: Upload V5 AnyKernel3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-android14-2025-09-R8-V5-Performance-SUSFS230-NoMount200-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9
