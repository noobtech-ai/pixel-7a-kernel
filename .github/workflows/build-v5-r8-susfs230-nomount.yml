name: Pixel 7a V5 - R8 6.1.145 Performance SUSFS 2.3.0 NoMount 2.0.0

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: R8 6.1.145 - Performance + SUSFS 2.3.0 + NoMount 2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout WildKernels R8
        uses: actions/checkout@v4
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          ref: r8
          fetch-depth: 1

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          testing: false

      - name: Setup swap
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        with:
          version: android14-6.1
          sublevel: "145"

      - name: Download 6.1.145 Android 14 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          os_patch_level: "2025-09"

      - name: Extract sublevel and filename
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"
          variant: Normal

      - name: Kernel fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"
          os_patch_level: "2025-09"

      - name: KernelSU Next
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ""

      - name: Prepare current SUSFS 2.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf susfs230
          git clone --depth=1 --branch gki-android14-6.1-dev \
            https://gitlab.com/pershoot/susfs4ksu.git susfs230
          grep -q '^version=v2.3.0$' susfs230/ksu_module_susfs/module.prop
          test -f susfs230/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f susfs230/kernel_patches/50_add_susfs_in_kernel-6.1.patch
          test -f susfs230/kernel_patches/fs/susfs.c
          test -f susfs230/kernel_patches/include/linux/susfs.h

      - name: Apply SUSFS 2.3.0 kernel patches
        shell: bash
        run: |
          set -euo pipefail
          KROOT="${GITHUB_WORKSPACE}/kernel"
          COMMON="${KROOT}/common"
          KSU="${KROOT}/KernelSU-Next/kernel"

          cp susfs230/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            "${KSU}/10_enable_susfs_for_ksu.patch"
          cp susfs230/kernel_patches/50_add_susfs_in_kernel-6.1.patch \
            "${COMMON}/50_add_susfs_in_kernel-6.1.patch"
          cp -f susfs230/kernel_patches/fs/* "${COMMON}/fs/"
          cp -f susfs230/kernel_patches/include/linux/* "${COMMON}/include/linux/"

          cd "${KSU}"
          patch -p1 < 10_enable_susfs_for_ksu.patch

          cd "${COMMON}"
          patch -p1 < 50_add_susfs_in_kernel-6.1.patch

      - name: Enable SUSFS
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          test -f "$DEFCONFIG"
          cat >> "$DEFCONFIG" <<'EOF'

          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Integrate MaxSteel NoMount 2.0.0
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh \
            -o /tmp/nomount-setup.sh
          chmod +x /tmp/nomount-setup.sh
          /tmp/nomount-setup.sh v2.0.0

      - name: Enable NoMount
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          sed -i '/^CONFIG_NOMOUNT=/d' "$DEFCONFIG"
          printf '\nCONFIG_NOMOUNT=y\n' >> "$DEFCONFIG"
          grep -q '^CONFIG_NOMOUNT=y$' "$DEFCONFIG"

      - name: Networking and BBRv3
        uses: ./.github/actions/networking
        with:
          version: android14-6.1
          kernel_version: "6.1"
          android_version: android14
          sublevel: "145"

      - name: NTSync
        uses: ./.github/actions/ntsync
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Ptrace
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.1"

      - name: Unicode fix
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.1"

      - name: Remove forced TCP NODELAY
        shell: bash
        run: |
          set -euo pipefail
          P=".github/actions/performance/action.yml"
          sed -i '/force_tcp_nodelay\.patch/d' "$P"
          ! grep -q 'force_tcp_nodelay\.patch' "$P"

      - name: V1 Performance Pack
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.1"

      - name: Enable HZ 300
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          sed -i -E '/^CONFIG_HZ_(100|250|300|1000)=y$/d' "$DEFCONFIG"
          sed -i -E '/^CONFIG_HZ=[0-9]+$/d' "$DEFCONFIG"
          printf '\nCONFIG_HZ_300=y\nCONFIG_HZ=300\n' >> "$DEFCONFIG"

      - name: Misc configs
        uses: ./.github/actions/misc

      - name: Device-specific patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: android14-6.1
          kernel_version: "6.1"

      - name: Kernel branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: Normal
          kernel_version: "6.1"
          android_version: android14
          version: android14-6.1
          sublevel: "145"

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan patch rejects
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-R8-V5-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Build SUSFS 2.3.0 module
        shell: bash
        run: |
          set -euo pipefail
          cd susfs230
          ./build_ksu_module.sh
          test -f ksu_module_susfs.zip

      - name: Setup cache and build environment
        uses: ./.github/actions/cache-setup
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: "6.1"
          sublevel: "145"

      - name: Initialize config fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Build Normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1
          bypass: false

      - name: Upload AnyKernel3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 6.1.145-android14-2025-09-R8-V5-Performance-SUSFS230-NoMount200-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: error
          compression-level: 9

      - name: Upload SUSFS 2.3.0 module
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SUSFS-2.3.0-KernelSU-module
          path: ${{ github.workspace }}/susfs230/ksu_module_susfs.zip
          if-no-files-found: error
          compression-level: 9
